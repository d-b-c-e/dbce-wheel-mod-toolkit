name: shared contracts
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  managed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test Dbce.Wheel.sln --configuration Release --nologo
      - name: Shared recording status and center-display layout
        run: dotnet run --project tests/SessionStatus -c Release
      - name: Managed developer injection client (fake delegates only)
        shell: powershell
        run: |
          dotnet run --project tests/NativeTestInjection -c Release -f net8.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build tests/NativeTestInjection -c Release -f net48
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tests/NativeTestInjection/bin/Release/net48/NativeTestInjection.exe
      - name: MSVC profile conformance
        shell: cmd
        run: native\forcemodel\build_conformance.bat
      - name: Transactional vendoring
        shell: powershell
        run: ./tools/tests/Test-SyncToolkit.ps1
      - name: Offline consumer status and provenance
        shell: powershell
        run: ./tools/tests/Test-ConsumerStatus.ps1
      - name: Consumer fixture process exit contract
        shell: powershell
        run: ./tools/tests/Test-ConsumerStatusExit.ps1
      - name: Exact-module binding (CoreCLR x64 and .NET Framework x86, no hardware)
        shell: powershell
        run: ./tools/tests/Test-NativeBinding.ps1
      - name: Native x64 exports
        shell: powershell
        run: ./native/wheelffb/build.ps1
      - name: Native x86 build
        shell: cmd
        run: native\wheelffb\build.bat x86
      - name: Watchdog and lock publication regressions (x64)
        shell: cmd
        run: |
          pushd .
          call native\wheelffb\test\build_burst_test.bat x64
          if errorlevel 1 exit /b 1
          popd
          native\wheelffb\build\burst_test.exe --pre-init-worker
      - name: Watchdog and lock publication regressions (x86)
        shell: cmd
        run: |
          pushd .
          call native\wheelffb\test\build_burst_test.bat x86
          if errorlevel 1 exit /b 1
          popd
          native\wheelffb\build\x86\burst_test.exe --pre-init-worker
      - name: Actual DLL lifecycle without device APIs (x64)
        shell: cmd
        run: native\wheelffb\test\build_lifecycle_test.bat x64
      - name: Actual DLL lifecycle without device APIs (x86)
        shell: cmd
        run: native\wheelffb\test\build_lifecycle_test.bat x86
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++11 -O2 -Wall -Wextra native/forcemodel/conformance.cpp -o /tmp/conformance
      - run: /tmp/conformance
      - run: g++ -std=c++11 -O2 -Wall -Wextra native/forcemodel/test_events.cpp -o /tmp/events
      - run: /tmp/events profiles
      - run: g++ -std=c++11 -O2 -Wall -Wextra native/forcemodel/test_signal_contracts.cpp -o /tmp/signals
      - run: /tmp/signals native/forcemodel/impact-contract.csv
      - run: g++ -std=c++11 -O2 -Wall -Wextra native/forcemodel/test_recovery.cpp -o /tmp/recovery
      - run: /tmp/recovery
      - name: ROM-free replay fixtures
        run: python3 -m unittest discover -s tools/replay -v
