name: shared contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  managed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test Dbce.Wheel.sln --configuration Release --nologo
      - name: MSVC profile conformance
        shell: cmd
        run: native\forcemodel\build_conformance.bat
      - name: Transactional vendoring
        shell: powershell
        run: ./tools/tests/Test-SyncToolkit.ps1
      - name: Exact-module binding (CoreCLR x64 and .NET Framework x86, no hardware)
        shell: powershell
        run: ./tools/tests/Test-NativeBinding.ps1
      - name: Native x64 exports
        shell: powershell
        run: ./native/wheelffb/build.ps1
      - name: Native x86 build
        shell: cmd
        run: native\wheelffb\build.bat x86
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++11 -O2 -Wall -Wextra native/forcemodel/conformance.cpp -o /tmp/conformance
      - run: /tmp/conformance
      - run: g++ -std=c++11 -O2 -Wall -Wextra native/forcemodel/test_events.cpp -o /tmp/events
      - run: /tmp/events profiles
      - run: g++ -std=c++11 -O2 -Wall -Wextra native/forcemodel/test_signal_contracts.cpp -o /tmp/signals
      - run: /tmp/signals native/forcemodel/impact-contract.csv
      - run: g++ -std=c++11 -O2 -Wall -Wextra native/forcemodel/test_recovery.cpp -o /tmp/recovery
      - run: /tmp/recovery
